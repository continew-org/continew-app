name: 🐛 Bug 报告
description: 报告使用 ContiNew App 过程中遇到的问题
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！请在提交前完成以下确认，以帮助我们快速定位问题：

        1. 请在[最新版本](https://github.com/continew-org/continew-app/releases)上验证问题是否仍然存在，项目仅维护最新版本；
        2. 请搜索[已有 Issue](https://github.com/continew-org/continew-app/issues)，避免重复提交；
        3. 使用与配置问题建议先查阅官方文档。

        > 依赖组件（如 wot-design-uni、uni-app、Vite）自身的问题请提交至对应组件仓库。

        > 安全漏洞请勿在此提交，请通过 [GitHub 安全通告](https://github.com/continew-org/continew-app/security/advisories/new) 负责任地披露。
  - type: checkboxes
    id: confirmation
    attributes:
      label: 提交前确认
      options:
        - label: 我确认在最新版本上仍能复现该问题
          required: true
        - label: 我确认已搜索已有 Issue，不存在重复提交
          required: true
        - label: 我确认这是 ContiNew App 自身的问题，而非依赖组件的问题
          required: true
        - label: 我已查阅官方文档或询问过 AI 大模型
          required: true
        - label: 我尝试阅读源码并定位过该问题
          required: false
        - label: 我愿意提交 PR 修复该问题
          required: false
  - type: input
    id: version
    attributes:
      label: ContiNew App 版本
      description: 产生问题的版本号
      placeholder: 例如：0.1.0
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: 问题涉及的端
      description: 可多选
      multiple: true
      options:
        - App（Android）
        - App（iOS）
        - 微信小程序
        - H5
        - 其他小程序平台
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 清晰、简洁地描述遇到的问题。
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 复现步骤
      description: 详细的复现步骤有助于我们定位问题，请尽量提供最小可复现示例。
      placeholder: |
        1. 启动演示应用，进入 xxx 页面
        2. 点击 / 配置 ...
        3. 出现 xxx 错误
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
      description: 你期望的正确行为是什么？
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 环境信息
      description: 一切有助于定位问题的环境信息。
      placeholder: |
        - Node / pnpm 版本：
        - 操作系统：
        - 微信开发者工具 / HBuilderX 版本（如涉及）：
        - 真机型号与系统版本（如涉及 App / 小程序端）：
        - 完整错误日志（请使用代码块格式，注意脱敏）
    validations:
      required: false
  - type: textarea
    id: additional
    attributes:
      label: 附加信息
      description: 截图或其他补充说明，可直接拖拽上传图片。
    validations:
      required: false
